name: Build and Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v2.1.0)'
        required: true
        default: 'v2.1.0'
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - 'Feature Update'
          - 'Major Release'
          - 'Bug Fix'
          - 'Security Update'
        default: 'Feature Update'

jobs:
  build-and-tag:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build TypeScript
      run: npm run build
      
    - name: Build Windows Installer
      run: npm run build-electron
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Generate Release Name
      id: release_name
      shell: pwsh
      run: |
        $VERSION = "${{ github.event.inputs.version }}"
        $TYPE = "${{ github.event.inputs.release_type }}"
        
        switch ($TYPE) {
          "Major Release" {
            $RELEASE_NAME = "🚀 Sage ERP Webhook Server $VERSION - Major Release"
          }
          "Feature Update" {
            $RELEASE_NAME = "✨ Sage ERP Webhook Server $VERSION - New Features"
          }
          "Bug Fix" {
            $RELEASE_NAME = "🐛 Sage ERP Webhook Server $VERSION - Bug Fixes"
          }
          "Security Update" {
            $RELEASE_NAME = "🔒 Sage ERP Webhook Server $VERSION - Security Update"
          }
          default {
            $RELEASE_NAME = "📦 Sage ERP Webhook Server $VERSION"
          }
        }
        
        echo "name=$RELEASE_NAME" >> $env:GITHUB_OUTPUT
    
    - name: Create Git Tag
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git tag -a ${{ github.event.inputs.version }} -m "${{ steps.release_name.outputs.name }}"
        git push origin ${{ github.event.inputs.version }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: windows-installer-${{ github.event.inputs.version }}
        path: dist-installer/*.exe
        retention-days: 30
    
    - name: Build Summary
      run: |
        echo "✅ Build completed successfully!"
        echo "📦 Windows installer built for ${{ github.event.inputs.version }}"
        echo "🏷️ Git tag created: ${{ github.event.inputs.version }}"
        echo "📥 Installer files available in artifacts"
        echo ""
        echo "🎯 Next steps:"
        echo "1. Go to GitHub Releases page"
        echo "2. Click 'Create a new release'"
        echo "3. Select tag: ${{ github.event.inputs.version }}"
        echo "4. Download artifacts and attach to release"
        echo "5. Publish release"
