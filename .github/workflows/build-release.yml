name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v2.1.0)'
        required: true
        default: 'v2.1.0'
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - 'Feature Update'
          - 'Major Release'
          - 'Bug Fix'
          - 'Security Update'
        default: 'Feature Update'

jobs:
  build-installer:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build TypeScript
      run: npm run build
      
    - name: Install Windows Service Dependencies
      run: npm install node-windows
    
    - name: Build Windows Service Package
      run: npm run build-windows-package
    
    - name: Generate Release Name
      id: release_name
      shell: pwsh
      run: |
        $VERSION = "${{ github.event.inputs.version }}"
        $TYPE = "${{ github.event.inputs.release_type }}"
        
        switch ($TYPE) {
          "Major Release" {
            $RELEASE_NAME = "🚀 Sage ERP Webhook Server $VERSION - Major Release"
          }
          "Feature Update" {
            $RELEASE_NAME = "✨ Sage ERP Webhook Server $VERSION - New Features"
          }
          "Bug Fix" {
            $RELEASE_NAME = "🐛 Sage ERP Webhook Server $VERSION - Bug Fixes"
          }
          "Security Update" {
            $RELEASE_NAME = "🔒 Sage ERP Webhook Server $VERSION - Security Update"
          }
          default {
            $RELEASE_NAME = "📦 Sage ERP Webhook Server $VERSION"
          }
        }
        
        echo "name=$RELEASE_NAME" >> $env:GITHUB_OUTPUT
    
    - name: Check Build Output
      run: |
        echo "📁 Checking if .exe files were created:"
        if (Test-Path "dist-installer/*.exe") {
          echo "✅ .exe files found!"
          Get-ChildItem dist-installer/*.exe | Format-Table Name, Length
        } else {
          echo "❌ No .exe files found!"
          echo "📁 Contents of dist-installer:"
          if (Test-Path "dist-installer") {
            Get-ChildItem dist-installer
          } else {
            echo "❌ dist-installer directory doesn't exist!"
          }
        }
      shell: pwsh
    
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-installer-${{ github.event.inputs.version }}
        path: |
          dist-installer/
          !dist-installer/builder-debug.yml
        retention-days: 30
    
    - name: Build Summary
      run: |
        echo "✅ Build completed successfully!"
        echo "📦 Windows Service Package built for ${{ github.event.inputs.version }}"
        echo "📁 Package: SageWebhookServer-${{ github.event.inputs.version }}-Windows.zip"
        echo "📥 Package available in artifacts"
        echo ""
        echo "🎯 Next steps:"
        echo "1. Download the ZIP package from workflow artifacts"
        echo "2. Create git tag: git tag ${{ github.event.inputs.version }} && git push origin ${{ github.event.inputs.version }}"
        echo "3. Go to GitHub Releases page"
        echo "4. Create release from tag: ${{ github.event.inputs.version }}"
        echo "5. Upload the ZIP file to the release"
        echo "6. Publish release"
        echo ""
        echo "✅ Manufacturers can then:"
        echo "   - Download ZIP file"
        echo "   - Extract and run install-service.bat"
        echo "   - Configure via web interface"
        echo "   - No Node.js installation needed!"
