name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v2.1.0)'
        required: true
        default: 'v2.1.0'
      release_notes:
        description: 'Release notes (optional - will use default if empty)'
        required: false

jobs:
  create-release:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build TypeScript
      run: npm run build
      
    - name: Build Windows Installer
      run: npm run build-electron
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: "Sage ERP Webhook Server ${{ github.event.inputs.version }}"
        files: |
          dist-installer/*.exe
        body: |
          # 🔗 Sage ERP Webhook Server ${{ github.event.inputs.version }}
          
          **Professional webhook server for Sage ERP integration with OdaFlow**
          
          ## 🪟 Windows Downloads (No Node.js Required)
          
          | Download | Size | Description |
          |----------|------|-------------|
          | **SageWebhookServer-Setup.exe** | ~50MB | Professional Windows installer |
          
          **✨ Features:**
          - ✅ **Node.js bundled inside** - No separate installation needed
          - ✅ **Web-based configuration** - 5 simple fields
          - ✅ **Database viewer** - See your Sage data with Excel export
          - ✅ **Professional monitoring** - Health dashboard
          - ✅ **Real-time sync** - Orders automatically sync to Sage
          
          ## 🚀 Quick Start
          1. Download SageWebhookServer-Setup.exe
          2. Double-click to install
          3. Configure your Sage database (5 simple fields)
          4. Done! ✅
          
          ## 📋 Requirements
          - Windows OS (7, 8, 10, 11)
          - Sage ERP with SQL Server
          - Internet connection
          
          **Perfect for manufacturers - no technical knowledge required!**
          
          ---
          
          ${{ github.event.inputs.release_notes }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
